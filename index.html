    <script>
        const music = document.getElementById('background-music');
        const musicIcon = document.getElementById('music-icon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicIcon.style.color = "#a94442";  // لون أحمر باهت عند الإيقاف
            } else {
                music.play();
                musicIcon.style.color = "#8B0000";  // لون أحمر دموي عند التشغيل
            }
            isPlaying = !isPlaying;
        }

        // تشغيل تلقائي بعد أول تفاعل
        document.body.addEventListener('click', function () {
            if (!music.played.length) {
                music.play();
                isPlaying = true;
                musicIcon.style.color = "#8B0000";
            }
        }, { once: true });
    </script>
